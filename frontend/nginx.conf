# =============================================================================
# nginx configuration for the SPA + API reverse proxy.
#
# The critical setting in this file is `proxy_buffering off` on the streaming
# location. nginx buffers proxied responses by default, which would collect the
# entire SSE stream and deliver it in one burst at the end — silently reducing
# streaming to a slow single dump while every test still passed. Streaming was
# verified through the dev proxy as 247 token events over a 0.62 s spread, and
# this block is what preserves that behaviour in production.
# =============================================================================

upstream api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 20 MB per file by the application; nginx must allow
    # a multipart body large enough to carry the configured maximum plus
    # overhead, or it would reject with a 413 before the API could explain why.
    client_max_body_size 25m;

    # Keep nginx's own identity out of responses.
    server_tokens off;

    # The API sets its own security headers; these cover the static assets.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Container healthcheck target — deliberately not proxied, so the UI reports
    # healthy even when the backend is still warming its models.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- streaming chat: must not be buffered -------------------------------
    location = /api/chat/stream {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_buffering off;          # the whole point of this block
        proxy_cache off;
        proxy_read_timeout 300s;      # a long answer must not be cut off
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- everything else on the API ----------------------------------------
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Generous but finite: a non-streaming answer was measured at ~14 s p50
        # in evaluation mode, and reranking adds ~0.6 s before generation starts.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old asset
    # hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA history fallback: client-side routes such as /documents/doc_abc are
    # not files on disk and must resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
